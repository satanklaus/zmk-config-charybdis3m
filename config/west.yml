manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
      revision: main
    - name: zmk-keyboard-charybdis3m
      url: https://github.com/satanklaus/zmk-keyboard-charybdis3m
      revision: main
      path: modules/zmk-keyboard-charybdis3m
  self:
    path: config
